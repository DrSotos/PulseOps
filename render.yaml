services:
  # PulseOps Backend REST API & Monitoring Engine
  - type: web
    name: pulseops-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_NAME
        value: PulseOps
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: START_EMBEDDED_WORKER
        value: true
      - key: ALLOW_PRIVATE_NETWORKS
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: pulseops-db
          property: connectionString

databases:
  - name: pulseops-db
    databaseName: pulseops
    user: pulseops
    plan: free
    region: frankfurt
