version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulseops-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pulseops
      POSTGRES_PASSWORD: pulseops_dev
      POSTGRES_DB: pulseops
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseops -d pulseops"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: pulseops-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_dev_data:
  redis_dev_data:
